name: Atualizar site de animes

on:
  schedule:
    - cron: "0 12 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rodar atualização
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
        run: python scripts/update.py

      - name: Salvar mudanças
        run: |
          git config user.name "atualizador-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Atualização automática $(date -u +%Y-%m-%d)"
          git push
